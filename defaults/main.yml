---
# major version of Java to install
#  - 1.8.0
#  - 11
#  - 17
#  - 21
java_versions:
  - "1.8.0"

java_default_version: "1.8.0"

# openjdk or amazon-corretto
java_provider: openjdk

# install JRE packages
java_install_jre: True

# install JDK devel packages
java_install_devel: False

java_set_default_version: False
